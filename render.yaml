services:
  - type: web
    name: reviewradar-backend
    env: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "https://review-radar-sepia.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        value: "sqlite:///./reviewradar.db"
